# Builds the wedgie app from source and checks it: the tests of jiro-core, jiro-shell and the
# replay command; the native module, jiro_core.mpy, built by MicroPython v1.29.0's mpy_ld, with its
# size and sha256; every vector of vectors/game/ and vectors/levels/ through it in MicroPython's qemu
# port for a Cortex-M0, with the stack peaks of start, step and replay; the check app; the frames of
# the app's tick; the app's flow on the host; its play test on qemu, its journals checked against
# native replay, with the heap filled down to the 137,760 bytes a wedgie has free, plain and with a
# hard IRQ at every tick, then to the 113,568 a power-up with the WEDGIE drive leaves, then with the
# screen checked against a full redraw after every tick; and that the app files committed in
# wedgie/app/ are what this commit builds. The MicroPython clone, its pyelftools venv and its
# mpy-cross and qemu builds live in ~/.cache/jiro-wedgie, cached on MicroPython's commit and the
# qemu build script. qemu runs under a timeout, because a module that hard-faults hangs it.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wedgie:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/jiro-wedgie
          key: wedgie-micropython-0fd6c573-${{ hashFiles('wedgie/scripts/build-qemu.sh', 'wedgie/scripts/irqsim/**') }}

      - name: Toolchain
        run: |
          bash scripts/bootstrap.sh
          arm-none-eabi-gcc --version | head -n 1
          qemu-system-arm --version | head -n 1

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: jiro-core, jiro-shell and the replay command
        run: cargo test --release --locked

      - name: MicroPython's mpy-cross and qemu port, and the port with irqsim
        id: micropython
        run: |
          firmware="$(bash wedgie/scripts/build-qemu.sh)"
          irqsim_firmware="$(bash wedgie/scripts/build-qemu.sh irqsim)"
          echo "firmware=$firmware" >>"$GITHUB_OUTPUT"
          echo "irqsim_firmware=$irqsim_firmware" >>"$GITHUB_OUTPUT"

      - name: jiro_core.mpy, its mpy_ld rules and its header
        run: |
          make -C wedgie/natmod/glue
          echo "=== BEGIN jiro_core.mpy ==="
          stat -c '%s bytes' wedgie/natmod/glue/jiro_core.mpy
          sha256sum wedgie/natmod/glue/jiro_core.mpy
          echo "=== END jiro_core.mpy ==="

      - name: Every game and level vector through the module on qemu's Cortex-M0
        run: |
          timeout 900 python3 -I wedgie/scripts/qemu_natmod_vectors.py "${{ steps.micropython.outputs.firmware }}" \
            wedgie/natmod/glue/jiro_core.mpy . --all

      - name: The check app keeps the wedgie's app limits
        run: bash wedgie/scripts/build-check.sh

      - name: The app keeps its tick's frames off the heap, and the wedgie's app limits
        run: bash wedgie/scripts/build-app.sh

      - name: The app's flow on the host, against a stand-in for the core
        run: python3 -I wedgie/scripts/test_app_flow.py

      - name: The app's play test on qemu at 137,760 bytes free
        run: |
          cargo build -q -p jiro-tools --locked
          timeout 600 python3 -I wedgie/scripts/qemu_app_check.py "${{ steps.micropython.outputs.firmware }}" \
            wedgie/app 137760

      - name: The play test with a hard IRQ at every tick, as the wedgie firmware's key IRQ
        run: |
          timeout 600 python3 -I wedgie/scripts/qemu_app_check.py "${{ steps.micropython.outputs.irqsim_firmware }}" \
            wedgie/app 137760 --hard-irq

      - name: The play test at the 113,568 bytes free that a power-up with the WEDGIE drive leaves
        run: |
          timeout 600 python3 -I wedgie/scripts/qemu_app_check.py "${{ steps.micropython.outputs.firmware }}" \
            wedgie/app 113568 50

      - name: The play test with the screen checked against a full redraw after every tick
        run: |
          timeout 600 python3 -I wedgie/scripts/qemu_app_check.py "${{ steps.micropython.outputs.firmware }}" \
            wedgie/app 100000 --screen

      - name: The committed app files are this commit's build
        run: bash scripts/check-drift.sh wedgie/app

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wedgie-app
          path: |
            wedgie/app/wedgie.json
            wedgie/app/jiro.py
            wedgie/app/jiro_app.mpy
            wedgie/app/jiro_core.mpy
            wedgie/app/jiro_levels.bin
          retention-days: 90
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wedgie-check
          path: |
            wedgie/check/wedgie.json
            wedgie/check/jiro.py
            wedgie/check/jiro_check.mpy
            wedgie/check/jiro_core.mpy
            wedgie/check/jiro_vectors.bin
          retention-days: 90
          if-no-files-found: error
